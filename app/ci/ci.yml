# Continuous integration for app/. MOVE THIS FILE to .github/workflows/ci.yml at
# the repository root: GitHub reads workflows only from there, and the wave-2
# implementer's allowlist stops at app/. Every path below already assumes the
# repository root as the checkout and app/ as the working directory.
#
# `npm run build` runs the type check, the Vite build, the prerender and the
# adversarial suite (npm run verify); `npm run smoke` then checks the served
# output. ALLOW_PLACEHOLDER_SITE_URL=1 because no public domain exists yet;
# when one does, set SITE_URL instead (as a repository variable).
name: ci

on:
  push:
  pull_request:

jobs:
  build-verify-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      ALLOW_PLACEHOLDER_SITE_URL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
