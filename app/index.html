<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:," />
    <title>The Ethics Record</title>
    <link rel="alternate" type="application/atom+xml" title="The Ethics Record: every new record" href="/feed.xml" />
    <script>
      // Apply saved theme / type size before first paint. Dark is the default.
      try {
        var t = localStorage.getItem('ct.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('ct.type') === 'large') document.documentElement.setAttribute('data-type', 'large');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app needs JavaScript to load and display the dataset.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
